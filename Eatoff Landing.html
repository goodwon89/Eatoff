<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Eatoff — 복잡함은 빼고, 시간만</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Eatoff — 미니멀한 간헐적 단식 & 식사 주기 타이머. 칼로리 입력 없이 시간만.">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  html { scroll-behavior: smooth; }
  html, body { margin: 0; padding: 0; }
  body { transition: background 400ms cubic-bezier(0.22, 1, 0.36, 1); }
  ::selection { background: #E5342A; color: #FFF; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="landing/EatoffBase.jsx"></script>
<script type="text/babel" src="landing/tweaks_panel.jsx"></script>
<script type="text/babel" src="landing/Nav.jsx"></script>
<script type="text/babel" src="landing/Hero.jsx"></script>
<script type="text/babel" src="landing/HeroSplit.jsx"></script>
<script type="text/babel" src="landing/AntiFeature.jsx"></script>
<script type="text/babel" src="landing/OneTap.jsx"></script>
<script type="text/babel" src="landing/StagesTimeline.jsx"></script>
<script type="text/babel" src="landing/WidgetShowcase.jsx"></script>
<script type="text/babel" src="landing/Stats.jsx"></script>
<script type="text/babel" src="landing/DownloadCTA.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const HEADLINE_OPTIONS = {
  A: {
    en: <>Just <span style={{ fontStyle: 'italic', fontWeight: 400 }}>time.</span></>,
    kr: '복잡함은 빼고, 시간만.',
  },
  B: {
    en: <>Not a diet.<br/>A <span style={{ fontStyle: 'italic', fontWeight: 400 }}>rhythm.</span></>,
    kr: '단식이 아니라, 리듬입니다.',
  },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "timerScale": "md",
  "timerFont": "jetbrains",
  "eatingGreen": "#1F9D55",
  "headlineVariant": "A",
  "heroVariant": "A"
}/*EDITMODE-END*/;

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const { dark, timerScale, timerFont, eatingGreen, headlineVariant, heroVariant } = tw;

  // Auto-activate Tweaks panel on mount (toolbar toggle may not be visible in all contexts)
  React.useEffect(() => {
    const t = setTimeout(() => {
      window.postMessage({ type: '__activate_edit_mode' }, '*');
    }, 300);
    return () => clearTimeout(t);
  }, []);

  // Persist dark separately to survive on Play Store link click, etc
  useEffect(() => {
    document.body.style.background = dark ? '#0A0A0A' : '#F5F5F0';
    document.body.style.color = dark ? '#FFFFFF' : '#111111';
  }, [dark]);

  // Custom eating green override — inject as CSS var
  const mono = MONO_MAP[timerFont] || MONO_MAP.jetbrains;

  // Provide colors context via prop
  const c = tokens(dark, eatingGreen);
  // NOTE: our tokens() takes override; components fetch fresh via tokens(dark).
  // Since we want the override to flow to components too, we monkey-patch here.
  React.useEffect(() => {
    const origTokens = window.__origTokens || window.tokens;
    if (!window.__origTokens) window.__origTokens = origTokens;
    window.tokens = (isDark) => origTokens(isDark, eatingGreen);
    return () => { window.tokens = origTokens; };
  }, [eatingGreen]);

  // Re-render lucide icons on every meaningful update
  useEffect(() => {
    if (window.lucide) {
      window.lucide.createIcons({ attrs: { 'stroke-width': 1.75, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' } });
    }
  });

  const headline = HEADLINE_OPTIONS[headlineVariant] || HEADLINE_OPTIONS.A;

  return (
    <div>
      <Nav dark={dark} onToggleDark={() => setTweak('dark', !dark)}/>
      {heroVariant === 'B'
        ? <HeroSplit dark={dark} mono={mono} headline={headline}/>
        : <Hero dark={dark} mono={mono} timerScale={timerScale} headline={headline}/>}
      <AntiFeature dark={dark} mono={mono}/>
      <OneTap dark={dark} mono={mono}/>
      <StagesTimeline dark={dark} mono={mono}/>
      <WidgetShowcase dark={dark} mono={mono}/>
      <Stats dark={dark} mono={mono}/>
      <DownloadCTA dark={dark} mono={mono} timerScale={timerScale}/>
      <Footer dark={dark}/>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Hero">
          <TweakRadio label="스타일" value={heroVariant}
            options={[
              { value: 'A', label: 'A · Living Timer' },
              { value: 'B', label: 'B · Split Screen' },
            ]}
            onChange={v => setTweak('heroVariant', v)}/>
        </TweakSection>
        <TweakSection label="Timer">
          <TweakRadio label="크기 · Size" value={timerScale}
            options={[
              { value: 'sm', label: '소' },
              { value: 'md', label: '중' },
              { value: 'lg', label: '대' },
            ]}
            onChange={v => setTweak('timerScale', v)}/>
          <TweakSelect label="폰트 · Font" value={timerFont}
            options={[
              { value: 'jetbrains', label: 'JetBrains Mono' },
              { value: 'plex', label: 'IBM Plex Mono' },
              { value: 'space', label: 'Space Mono' },
            ]}
            onChange={v => setTweak('timerFont', v)}/>
        </TweakSection>
        <TweakSection label="Color">
          <TweakColor label="Eating Green" value={eatingGreen}
            options={['#1F9D55', '#4CAF50', '#10B981', '#4A9070']}
            onChange={v => setTweak('eatingGreen', v)}/>
        </TweakSection>
        <TweakSection label="Copy">
          <TweakRadio label="Headline" value={headlineVariant}
            options={[
              { value: 'A', label: 'A · Just time.' },
              { value: 'B', label: 'B · Not a diet.' },
            ]}
            onChange={v => setTweak('headlineVariant', v)}/>
        </TweakSection>
        <TweakSection label="Theme">
          <TweakRadio label="Mode" value={dark}
            options={[
              { value: false, label: 'Light' },
              { value: true, label: 'Dark' },
            ]}
            onChange={v => setTweak('dark', v)}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

function boot() {
  const required = ['Nav','Hero','HeroSplit','AntiFeature','OneTap','StagesTimeline','WidgetShowcase','Stats','DownloadCTA','Footer','TweaksPanel','useTweaks','tokens'];
  if (required.some(n => !window[n])) return setTimeout(boot, 30);
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
boot();
</script>
</body>
</html>
